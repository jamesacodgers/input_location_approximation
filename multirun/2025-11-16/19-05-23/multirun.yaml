hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - posterior=sbvi
    - posterior.num_samples=1,4,16
    - optimization.epochs=30_000
    - posterior.temperature=1,1e-3,1e-6
    - seed=0
    - optimization.learning_rate=3e-4,1e-4
    - dataset=spiked_linear
    - dataset.n_train=4,64,512
    - dataset.n_features=1,500,10000
    - posterior.num_squash_vectors=1,4,16
    - model.hidden_layers=[]
  job:
    name: main
    chdir: null
    override_dirname: dataset.n_features=1,500,10000,dataset.n_train=4,64,512,dataset=spiked_linear,model.hidden_layers=[],optimization.epochs=30_000,optimization.learning_rate=3e-4,1e-4,posterior.num_samples=1,4,16,posterior.num_squash_vectors=1,4,16,posterior.temperature=1,1e-3,1e-6,posterior=sbvi,seed=0
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /Users/james/Projects/input_location_approximation
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/james/Projects/input_location_approximation/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      dataset: spiked_linear
      posterior: sbvi
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
posterior:
  type: sbvi
  weight_variance_init: 1
  bias_variance_init: 1
  num_samples: 256
  temperature: 1
  posterior_exponentiation: tempered
  num_squash_vectors: 1
dataset:
  type: regression
  label: spiked_linear
  n_train: 1000
  n_test: 200
  rank: 1
  n_features: 100
  noise_std: 0.1
  ood_input_variance:
  - 1.0
seed: 0
optimization:
  optimizer: adam
  learning_rate: 0.0001
  batch_size: 2056
  epochs: 30000
model:
  type: mlp
  hidden_layers: []
  prior_std: 0.33
  ff: None
  ff_amplitudes: false
