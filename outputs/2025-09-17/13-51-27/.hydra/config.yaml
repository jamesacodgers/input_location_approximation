dataset:
  type: regression
  label: synthetic_regression
  n_train: 1000
  n_test: 200
  n_features: 1
  n_empty_features: 0
  noise_std: 0.1
optimization:
  learning_rate: 1.0e-06
  batch_size: 128
  epochs: 1000
model:
  type: mlp
  hidden_layers:
  - 64
  - 64
  prior_variance: 1.0
posterior:
  type: mfvi
  weight_variance_init: 1
  bias_variance_init: 1
  num_samples: 10
