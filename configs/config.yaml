# configs/config.yaml
seed: 0

dataset: 
  type: regression
  label: synthetic_regression
  n_train: 1000
  n_test: 200
  n_features: 1
  n_empty_features: 0
  noise_std: 0.1
  ood_input_variance: [0.01, 0.1, 1.0, 10.0, 100.0]
  frequency: 1.0

optimization:
  learning_rate: 1e-4
  batch_size: 2056
  epochs: 100

model:
  type: mlp
  hidden_layers: [128,128]
  prior_variance: 0.1
  ff: None
  ff_amplitudes: False

defaults:
  - posterior: map
  - _self_

  
